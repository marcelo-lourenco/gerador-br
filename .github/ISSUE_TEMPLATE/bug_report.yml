name: "Relatar um Bug 🐛"
description: "Crie um relatório de bug para nos ajudar a melhorar o gerador-br"
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por reservar um tempo para relatar um bug! Por favor, preencha as informações abaixo.

  - type: checkboxes
    id: checkboxes
    attributes:
      label: Contribuir
      options:
        - label: Estou disposto a enviar um Pull Request com a correção.

  - type: dropdown
    id: generator_name
    attributes:
      label: Qual gerador apresentou o problema?
      options:
        - CPF
        - CNPJ / CNPJ Alfanumérico
        - CNH / Categoria CNH
        - CNS
        - PIS
        - RG
        - Título de Eleitor
        - Passaporte
        - Certidão (Nascimento/Casamento/Óbito)
        - Inscrição Estadual
        - Nome / Apelido / Pessoa
        - Endereço / CEP
        - Telefone / Celular / DDD / Operadora
        - Banco / Conta Bancária
        - Cartão de Crédito
        - Placa de Veículo / RENAVAM
        - Texto / Lorem Ipsum
        - Outro
    validations:
      required: true

  - type: textarea
    id: bug_description
    attributes:
      label: Descreva o bug
      description: Uma descrição clara e concisa do problema encontrado.
      placeholder: "Ex: Ao chamar a função cpf(), recebi uma string malformatada..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Código para reprodução
      description: Forneça um exemplo de código simples ou repositório mínimo para reproduzir o erro.
      placeholder: |
        ```typescript
        import { cpf } from 'gerador-br';
        console.log(cpf(true));
        ```

  - type: input
    id: version
    attributes:
      label: Versão do gerador-br
      placeholder: "Ex: 2.0.0"
    validations:
      required: false

  - type: dropdown
    id: package_manager
    attributes:
      label: Gerenciador de Pacotes
      options:
        - pnpm
        - npm
        - yarn
        - bun
        - outro
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: Contexto Adicional
      description: Adicione qualquer outra informação relevante, capturas de tela ou logs.
