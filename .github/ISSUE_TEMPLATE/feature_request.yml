name: "Proposta de Novo Recurso 🚀"
description: "Proponha um novo gerador ou funcionalidade para o gerador-br"
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por contribuir com ideias para o gerador-br!

  - type: checkboxes
    id: checkboxes
    attributes:
      label: Contribuir
      options:
        - label: Estou disposto a enviar um Pull Request implementando esta funcionalidade.

  - type: textarea
    id: feature_description
    attributes:
      label: Descrição da Funcionalidade
      description: Explique a necessidade ou o problema que este novo recurso resolve.
      placeholder: "Como desenvolvedor, eu gostaria de gerar dados de [exemplo] para facilitar os testes..."
    validations:
      required: true

  - type: textarea
    id: suggested_solution
    attributes:
      label: Solução Sugerida ou API Desejada
      description: Como você imagina o funcionamento ou a chamada desta função?
      placeholder: |
        ```typescript
        import { novoGerador } from 'gerador-br';
        console.log(novoGerador());
        ```
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: Contexto Adicional
      description: Adicione qualquer outro contexto, links de referência ou documentação relevante.
